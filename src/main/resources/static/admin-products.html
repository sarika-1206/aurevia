<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aurevia | Manage Products</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-page {
            padding: 50px 0;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 34px;
            margin-bottom: 5px;
        }

        .admin-header p {
            color: #777;
        }

        .product-form {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            margin-bottom: 35px;
        }

        .product-form h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #b88a2e;
        }

        .form-actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        .products-table-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 17px 18px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #faf8f3;
            color: #555;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .product-name {
            font-weight: 600;
        }

        .price {
            color: #9a711f;
            font-weight: 700;
        }

        .stock {
            font-weight: 600;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #e7f6ec;
            color: #218838;
        }

        .status-inactive {
            background: #f8e8e8;
            color: #b02a37;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .small-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .edit-btn {
            background: #eee8d8;
            color: #795d20;
        }

        .delete-btn {
            background: #f8dddd;
            color: #a52834;
        }

        .cancel-btn {
            background: #eee;
            color: #555;
        }

        .message {
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
        }

        .success-message {
            background: #e7f6ec;
            color: #218838;
        }

        .error-message {
            background: #f8e8e8;
            color: #b02a37;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #777;
        }

        @media (max-width: 768px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <header style="background:white; border-bottom:1px solid #eee; padding:18px 0;">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center;">

            <a href="admin.html"
               style="font-size:25px; font-weight:800; color:#b88a2e;">
                AUREVIA
            </a>

            <div style="display:flex; gap:10px; align-items:center;">
                <a href="admin.html" class="btn btn-outline">Dashboard</a>
                <button onclick="logout()" class="btn btn-primary">Logout</button>
            </div>

        </div>
    </header>


    <main class="admin-page">

        <div class="container">

            <div class="admin-header">

                <div>
                    <h1>Product Management</h1>
                    <p>Add, edit and manage your Aurevia products.</p>
                </div>

                <a href="shop.html" class="btn btn-outline">
                    View Store
                </a>

            </div>


            <div id="successMessage"
                 class="message success-message">
            </div>

            <div id="errorMessage"
                 class="message error-message">
            </div>


            <!-- PRODUCT FORM -->

            <section class="product-form">

                <h2 id="formTitle">
                    Add New Product
                </h2>

                <form id="productForm">

                    <input type="hidden" id="productId">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Product Name</label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Example: Aurevia Smartwatch"
                                required>
                        </div>


                        <div class="form-group">
                            <label>Category</label>

                            <select id="category" required>

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Fashion">
                                    Fashion
                                </option>

                                <option value="Home">
                                    Home
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Wearables">
                                    Wearables
                                </option>

                            </select>
                        </div>


                        <div class="form-group">
                            <label>Price (₹)</label>

                            <input
                                type="number"
                                id="price"
                                min="0"
                                step="0.01"
                                placeholder="4999"
                                required>
                        </div>


                        <div class="form-group">
                            <label>Stock</label>

                            <input
                                type="number"
                                id="stock"
                                min="0"
                                placeholder="25"
                                required>
                        </div>


                        <div class="form-group full">
                            <label>Image URL</label>

                            <input
                                type="text"
                                id="imageUrl"
                                placeholder="https://example.com/product.jpg">
                        </div>


                        <div class="form-group full">

                            <label>Description</label>

                            <textarea
                                id="description"
                                placeholder="Enter a professional product description..."
                                required></textarea>

                        </div>

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="submitButton">
                            Add Product
                        </button>

                        <button
                            type="button"
                            class="btn cancel-btn"
                            id="cancelButton"
                            onclick="resetForm()"
                            style="display:none;">
                            Cancel
                        </button>

                    </div>

                </form>

            </section>


            <!-- PRODUCT TABLE -->

            <section>

                <h2 style="margin-bottom:20px;">
                    All Products
                </h2>

                <div class="products-table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="productsTable">

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>


    <script src="app.js"></script>

    <script>

        let products = [];


        document.addEventListener("DOMContentLoaded", () => {

            const user = getCurrentUser();

            if (!user || user.role !== "ADMIN") {

                window.location.href = "login.html";

                return;
            }

            loadProducts();

        });


        async function loadProducts() {

            try {

                products = await apiRequest("/products");

                displayProducts(products);

            } catch (error) {

                showError(error.message);

            }

        }


        function displayProducts(products) {

            const table = document.getElementById("productsTable");

            table.innerHTML = "";

            if (!products || products.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                No products available.
                            </div>
                        </td>
                    </tr>
                `;

                return;
            }


            products.forEach(product => {

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>${product.id}</td>

                    <td>
                        <div class="product-name">
                            ${escapeHtml(product.name)}
                        </div>
                    </td>

                    <td>
                        ${escapeHtml(product.category)}
                    </td>

                    <td class="price">
                        ₹${Number(product.price).toLocaleString("en-IN")}
                    </td>

                    <td class="stock">
                        ${product.stock}
                    </td>

                    <td>

                        <span class="status ${
                            product.active
                                ? "status-active"
                                : "status-inactive"
                        }">

                            ${
                                product.active
                                    ? "Active"
                                    : "Inactive"
                            }

                        </span>

                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="small-btn edit-btn"
                                onclick="editProduct(${product.id})">
                                Edit
                            </button>

                            <button
                                class="small-btn delete-btn"
                                onclick="deleteProduct(${product.id})">
                                Delete
                            </button>

                        </div>

                    </td>

                `;

                table.appendChild(row);

            });

        }


        document.getElementById("productForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const productId =
                    document.getElementById("productId").value;

                const productData = {

                    name:
                        document.getElementById("name").value.trim(),

                    description:
                        document.getElementById("description").value.trim(),

                    price:
                        Number(document.getElementById("price").value),

                    stock:
                        Number(document.getElementById("stock").value),

                    category:
                        document.getElementById("category").value,

                    imageUrl:
                        document.getElementById("imageUrl").value.trim(),

                    active: true

                };


                try {

                    if (productId) {

                        await apiRequest(
                            `/admin/products/${productId}`,
                            {
                                method: "PUT",
                                body: JSON.stringify(productData)
                            }
                        );

                        showSuccess(
                            "Product updated successfully."
                        );

                    } else {

                        await apiRequest(
                            "/admin/products",
                            {
                                method: "POST",
                                body: JSON.stringify(productData)
                            }
                        );

                        showSuccess(
                            "Product added successfully."
                        );
                    }


                    resetForm();

                    await loadProducts();

                } catch (error) {

                    showError(error.message);

                }

            });


        function editProduct(id) {

            const product =
                products.find(item => item.id === id);

            if (!product) {
                return;
            }


            document.getElementById("productId").value =
                product.id;

            document.getElementById("name").value =
                product.name;

            document.getElementById("description").value =
                product.description;

            document.getElementById("price").value =
                product.price;

            document.getElementById("stock").value =
                product.stock;

            document.getElementById("category").value =
                product.category;

            document.getElementById("imageUrl").value =
                product.imageUrl || "";


            document.getElementById("formTitle").textContent =
                "Edit Product";

            document.getElementById("submitButton").textContent =
                "Update Product";

            document.getElementById("cancelButton").style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        async function deleteProduct(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to remove this product?"
                );

            if (!confirmed) {
                return;
            }


            try {

                await apiRequest(
                    `/admin/products/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                showSuccess(
                    "Product removed successfully."
                );

                await loadProducts();

            } catch (error) {

                showError(error.message);

            }

        }


        function resetForm() {

            document.getElementById("productForm").reset();

            document.getElementById("productId").value = "";

            document.getElementById("formTitle").textContent =
                "Add New Product";

            document.getElementById("submitButton").textContent =
                "Add Product";

            document.getElementById("cancelButton").style.display =
                "none";

        }


        function showSuccess(message) {

            const element =
                document.getElementById("successMessage");

            element.textContent = message;

            element.style.display = "block";

            document.getElementById("errorMessage")
                .style.display = "none";

            setTimeout(() => {
                element.style.display = "none";
            }, 3000);

        }


        function showError(message) {

            const element =
                document.getElementById("errorMessage");

            element.textContent = message;

            element.style.display = "block";

            document.getElementById("successMessage")
                .style.display = "none";

        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>

</body>

</html>
