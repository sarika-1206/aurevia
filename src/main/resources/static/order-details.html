<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details | Aurevia</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .navbar {
            background: white;
            border-bottom: 1px solid #eee8dc;
        }

        .nav-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #9a701f;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .order-page {
            padding: 55px 0 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #777;
            font-size: 14px;
        }

        .back-link:hover {
            color: #9a701f;
        }

        .order-header {
            background: #1f1f1f;
            color: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .order-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .order-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .order-date {
            color: #bbb;
            font-size: 14px;
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            background: #edf9f0;
            color: #18743a;
            font-size: 12px;
            font-weight: 700;
        }

        .items-section {
            background: white;
            border: 1px solid #eee8dc;
            border-radius: 16px;
            padding: 25px;
        }

        .items-section h2 {
            margin-bottom: 20px;
        }

        .order-item {
            display: grid;
            grid-template-columns: 85px 1fr auto;
            gap: 18px;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #eee8dc;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            overflow: hidden;
            background: #eee9df;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-category {
            color: #a27625;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .item-name {
            font-size: 17px;
            font-weight: 700;
            margin: 4px 0;
        }

        .item-info {
            color: #777;
            font-size: 13px;
        }

        .item-total {
            font-size: 17px;
            font-weight: 800;
        }

        .order-summary {
            margin-top: 25px;
            margin-left: auto;
            max-width: 330px;
            border-top: 1px solid #eee8dc;
            padding-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #666;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #eee8dc;
            font-size: 21px;
            font-weight: 800;
        }

        .state-message {
            text-align: center;
            padding: 80px 20px;
            color: #777;
        }

        @media (max-width: 650px) {

            .order-header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-item {
                grid-template-columns: 70px 1fr;
            }

            .item-image {
                width: 70px;
                height: 70px;
            }

            .item-total {
                grid-column: 2;
            }

            .order-summary {
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <div class="container nav-inner">

            <a href="index.html" class="logo">
                AUREVIA
            </a>

            <div class="nav-actions">

                <a href="shop.html" class="btn btn-outline">
                    Shop
                </a>

                <a href="orders.html" class="btn btn-primary">
                    My Orders
                </a>

            </div>

        </div>

    </nav>


    <!-- ORDER DETAILS -->
    <main class="order-page">

        <div class="container">

            <a
                href="orders.html"
                class="back-link">
                ← Back to Orders
            </a>


            <div
                id="orderContainer">

                <div class="state-message">
                    Loading order details...
                </div>

            </div>

        </div>

    </main>


    <script src="app.js"></script>

    <script>

        const orderContainer =
            document.getElementById(
                "orderContainer"
            );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const orderId =
            params.get("id");


        function formatPrice(price) {

            return new Intl.NumberFormat(
                "en-IN",
                {
                    style: "currency",
                    currency: "INR",
                    maximumFractionDigits: 2
                }
            ).format(price);
        }


        function formatDate(dateString) {

            const date =
                new Date(dateString);


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );
        }


        async function loadOrder() {

            if (!getToken()) {

                window.location.href =
                    "login.html";

                return;
            }


            if (!orderId) {

                showError(
                    "Order not found."
                );

                return;
            }


            try {

                const order =
                    await apiRequest(
                        "/orders/" + orderId
                    );


                await displayOrder(order);

            } catch (error) {

                showError(
                    "Unable to load this order."
                );
            }
        }


        async function displayOrder(order) {

            let orderItems = [];


            /*
             * The current backend provides
             * order information through
             * /api/orders/{id}.
             *
             * We also try to load the order
             * items from the optional endpoint.
             */

            try {

                orderItems =
                    await apiRequest(
                        "/orders/" +
                        order.id +
                        "/items"
                    );

            } catch (error) {

                orderItems = [];
            }


            const itemsHTML =
                orderItems.length > 0

                ? orderItems.map(function(item) {

                    const product =
                        item.product;

                    const image =
                        product.imageUrl ||
                        "https://images.unsplash.com/photo-1523275335684-37898b6baf30";

                    const itemTotal =
                        item.price *
                        item.quantity;


                    return `

                        <div class="order-item">

                            <div class="item-image">

                                <img
                                    src="${image}"
                                    alt="${product.name}"
                                >

                            </div>


                            <div>

                                <div class="item-category">
                                    ${product.category}
                                </div>

                                <div class="item-name">
                                    ${product.name}
                                </div>

                                <div class="item-info">
                                    Quantity:
                                    ${item.quantity}
                                    ×
                                    ${formatPrice(item.price)}
                                </div>

                            </div>


                            <div class="item-total">
                                ${formatPrice(itemTotal)}
                            </div>

                        </div>

                    `;

                }).join("")

                : `

                    <div class="state-message">
                        Order items are not available.
                    </div>

                `;


            orderContainer.innerHTML = `

                <section class="order-header">

                    <div class="order-header-top">

                        <div>

                            <h1>
                                Order #${order.id}
                            </h1>

                            <div class="order-date">
                                Placed on
                                ${formatDate(order.createdAt)}
                            </div>

                        </div>


                        <div class="status">
                            ${order.status}
                        </div>

                    </div>

                </section>


                <section class="items-section">

                    <h2>
                        Items in this Order
                    </h2>

                    ${itemsHTML}


                    <div class="order-summary">

                        <div class="summary-row">

                            <span>
                                Subtotal
                            </span>

                            <span>
                                ${formatPrice(order.totalAmount)}
                            </span>

                        </div>


                        <div class="summary-row">

                            <span>
                                Delivery
                            </span>

                            <span>
                                FREE
                            </span>

                        </div>


                        <div class="summary-total">

                            <span>
                                Total
                            </span>

                            <span>
                                ${formatPrice(order.totalAmount)}
                            </span>

                        </div>

                    </div>

                </section>

            `;
        }


        function showError(message) {

            orderContainer.innerHTML = `

                <div class="state-message">

                    <h2>
                        ${message}
                    </h2>

                    <br>

                    <a
                        href="orders.html"
                        class="btn btn-primary">
                        Back to Orders
                    </a>

                </div>

            `;
        }


        loadOrder();

    </script>

</body>
</html>
