<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orders | Aurevia Admin</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f6f3ed;
        }

        .admin-layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 270px;
            background: #1f1f1f;
            color: white;
            padding: 35px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .sidebar-logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #c7952f;
            margin-bottom: 55px;
            padding-left: 12px;
        }

        .sidebar-title {
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
            margin: 0 12px 15px;
        }

        .sidebar a {
            display: block;
            padding: 14px 12px;
            color: #eee;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #373126;
            color: #d2a33d;
        }

        .main-content {
            margin-left: 270px;
            width: calc(100% - 270px);
            padding: 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 38px;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #777;
        }

        .orders-box {
            background: white;
            border: 1px solid #eee8dc;
            border-radius: 16px;
            overflow: hidden;
        }

        .orders-header {
            padding: 24px;
            border-bottom: 1px solid #eee8dc;
        }

        .orders-header h2 {
            margin-bottom: 5px;
        }

        .orders-header p {
            color: #777;
            font-size: 14px;
        }

        .order-row {
            padding: 24px;
            border-bottom: 1px solid #eee8dc;
            display: grid;
            grid-template-columns:
                80px
                1.5fr
                1fr
                130px
                120px;
            align-items: center;
            gap: 20px;
        }

        .order-row:last-child {
            border-bottom: none;
        }

        .order-id {
            font-weight: 800;
            color: #9a701f;
        }

        .customer-name {
            font-weight: 700;
        }

        .customer-email {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
        }

        .order-date {
            color: #777;
            font-size: 13px;
        }

        .order-total {
            font-weight: 800;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.placed {
            background: #edf9f0;
            color: #18743a;
        }

        .status.cancelled {
            background: #fff0ef;
            color: #a33b35;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 70px 20px;
            color: #777;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            color: #8f681e;
            font-weight: 700;
        }

        @media (max-width: 900px) {

            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 220px;
                width: calc(100% - 220px);
                padding: 25px;
            }

            .order-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {

            .admin-layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .order-row {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            AUREVIA
        </div>

        <div class="sidebar-title">
            ADMIN PANEL
        </div>

        <a href="admin.html">
            Dashboard
        </a>

        <a href="admin-products.html">
            Products
        </a>

        <a href="admin-orders.html"
           class="active">
            Orders
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="#"
           onclick="logout(); return false;"
           style="margin-top:40px;">
            Logout
        </a>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <a href="admin.html"
           class="back-button">
            ← Back to Dashboard
        </a>

        <div class="page-header">

            <h1>
                Customer Orders
            </h1>

            <p>
                Review and monitor orders placed through Aurevia.
            </p>

        </div>


        <div class="orders-box">

            <div class="orders-header">

                <h2>
                    All Orders
                </h2>

                <p>
                    Orders from Aurevia customers
                </p>

            </div>

            <div id="ordersContainer">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </main>

</div>


<script src="app.js"></script>

<script>

async function loadAdminOrders() {

    const container =
        document.getElementById("ordersContainer");

    try {

        const orders =
            await apiRequest("/admin/orders");

        if (!orders || orders.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>No orders yet</h2>
                    <p>
                        Customer orders will appear here.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML =
            orders.map(order => {

                const statusClass =
                    order.status === "CANCELLED"
                        ? "cancelled"
                        : "placed";

                const date =
                    new Date(order.createdAt)
                        .toLocaleDateString(
                            "en-IN",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric"
                            }
                        );

                const amount =
                    new Intl.NumberFormat(
                        "en-IN",
                        {
                            style: "currency",
                            currency: "INR"
                        }
                    ).format(order.totalAmount);

                return `

                    <div class="order-row">

                        <div class="order-id">
                            #${order.id}
                        </div>

                        <div>

                        <div>

                        <div class="customer-name">
                            ${order.user ? order.user.name : "Unknown Customer"}
                        </div>

                        <div class="customer-email">
                            ${order.user ? order.user.email : "No email"}
                        </div>

                    </div>

                        </div>

                        <div class="order-date">
                            ${date}
                        </div>

                        <div class="order-total">
                            ${amount}
                        </div>

                        <div>

                            <span class="status ${statusClass}">
                                ${order.status}
                            </span>

                        </div>

                    </div>

                `;

            }).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                <h2>
                    Unable to load orders
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;
    }
}

loadAdminOrders();

</script>

</body>

</html>
