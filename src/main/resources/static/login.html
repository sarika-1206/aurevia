<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Aurevia</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                linear-gradient(
                    135deg,
                    #f8f6f1,
                    #eee5d4
                );
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #9a701f;
            margin-bottom: 30px;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd5c7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #b88a2e;
            box-shadow: 0 0 0 3px rgba(184, 138, 46, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #b88a2e;
            color: white;
            font-size: 16px;
            font-weight: 700;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #8f681e;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .auth-message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        .auth-message.success {
            display: block;
            background: #edf9f0;
            color: #18743a;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .auth-footer a {
            color: #9a701f;
            font-weight: 700;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                AUREVIA
            </div>

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Sign in to continue your Aurevia experience.
            </p>

            <div id="message" class="auth-message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </div>

            <a href="index.html" class="back-home">
                ← Back to Aurevia
            </a>

        </div>

    </main>


    <script src="app.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "auth-message " + type;
        }

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            message.className = "auth-message";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {

                const response = await apiRequest(
                    "/auth/login",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                setToken(response.token);
                setCurrentUser(response.user);

                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );

                setTimeout(function() {

                    if (response.user.role === "ADMIN") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "shop.html";
                    }

                }, 700);

            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });
    </script>

</body>
</html>
